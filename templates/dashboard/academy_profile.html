{% extends "dashboard/_layout.html" %}
{% block content %}
<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-800">Perfil da Academia</h2>
    <p class="text-slate-600">Dados e configurações da sua academia.</p>
  </div>

  <div class="bg-white rounded-xl shadow p-6 max-w-xl">
    <form method="POST" action="{{ url_for('academy_profile_update') }}" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nome da Academia</label>
        <input name="name" value="{{ academy.name }}" required class="w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">CNPJ</label>
        <input name="cnpj" value="{{ academy.cnpj or '' }}" class="w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Telefone</label>
        <input name="phone" value="{{ academy.phone or '' }}" class="w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
        <input type="email" name="email" value="{{ academy.email or '' }}" class="w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Plano</label>
        <input value="{{ academy.plan_type }}" disabled class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-slate-500">
        <p class="text-xs text-slate-500 mt-1">Para alterar o plano, contate o Super Admin.</p>
      </div>
      <div class="flex justify-end">
        <button type="submit" class="rounded-lg bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 text-sm font-semibold">Salvar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
