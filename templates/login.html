{% extends "base.html" %}
{% block body %}
<main class="flex-1 grid lg:grid-cols-2">
  <div class="hidden lg:flex flex-col items-center justify-center bg-gradient-to-br from-blue-900 via-blue-700 to-blue-500 p-12 text-white">
    <img src="{{ url_for('static', filename='logo.svg') }}" alt="Sistema de Gestão" class="w-[520px] max-w-full">
    <p class="mt-8 text-center text-blue-100 max-w-md text-lg">
      Plataforma SaaS completa para gestão multi-tenant de academias de artes marciais.
      Alunos, turmas, financeiro e módulo social em um só lugar.
    </p>
  </div>
  <div class="flex items-center justify-center p-6 lg:p-12">
    <div class="w-full max-w-md">
      <div class="lg:hidden mb-8 flex justify-center">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="logo" class="w-[320px]">
      </div>
      <h1 class="text-3xl font-bold text-slate-900">Entrar</h1>
      <p class="mt-2 text-slate-600">Acesse sua conta para gerenciar sua academia.</p>
      <form method="POST" action="{{ url_for('login_submit') }}" class="mt-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">Usuário ou e-mail</label>
          <input type="text" name="login" required autofocus autocomplete="username"
                 class="mt-1 w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition"
                 placeholder="seu.email@exemplo.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">Senha</label>
          <input type="password" name="password" required autocomplete="current-password"
                 class="mt-1 w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition"
                 placeholder="••••••••">
        </div>
        {% if error %}
        <div class="rounded-lg bg-red-50 border border-red-200 p-3 text-sm text-red-700">{{ error }}</div>
        {% endif %}
        <button type="submit"
                class="w-full rounded-lg bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-semibold py-3 shadow-md transition">
          Entrar
        </button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
